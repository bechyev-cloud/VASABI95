<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VASABI — меню и заказ</title>
<meta name="description" content="Меню VASABI: бургеры, пицца, суши, шаурма, стейки. Соберите заказ и отправьте его в WhatsApp.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VASABI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#111316; --ink2:#2b2f35; --muted:#80868f; --line:#eceef1; --soft:#f4f5f7;
  --acc:#1fa64a; --acc2:#16833a; --acc-soft:#eaf7ee; --acc-line:#c9ebd4;
  --danger:#e5484d; --danger-soft:#fdeeee;
  --shadow:0 1px 2px rgba(17,19,22,.04),0 6px 22px rgba(17,19,22,.06);
  --head:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,a,input,textarea,label,.item,.cat-head{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{scroll-behavior:smooth;scroll-padding-top:110px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
svg{display:block}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#27b956,#15843a);display:grid;place-items:center;color:#fff;font:800 22px/1 var(--head);box-shadow:0 6px 16px rgba(31,166,74,.28);flex:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:800 21px/1.1 var(--head);letter-spacing:.02em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink2);flex:none;transition:transform .12s,background .2s}
.icon-btn:active{transform:scale(.92);background:var(--soft)}
.install{height:42px;border-radius:14px;border:0;background:var(--acc-soft);color:var(--acc2);font-weight:800;font-size:13px;padding:0 12px;display:flex;align-items:center;gap:6px}

/* ---------- Hero ---------- */
/* ---------- Categories ---------- */
#cats{padding-top:0}
.menu-bar{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 10px}
.menu-bar h2{margin:0;font:700 17px/1.2 var(--head)}
.view-btn{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;color:var(--ink2);transition:transform .15s}
.view-btn:active{transform:scale(.94)}
.view-btn svg{color:var(--acc2)}
.view-btn .vd{display:flex;gap:3px;margin-left:2px}
.view-btn .vd i{width:5px;height:5px;border-radius:3px;background:#d5d9de;transition:all .3s}
.view-btn .vd i.on{width:12px;background:var(--acc)}
/* общий для компактных видов */
#cats .cat-text b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Вид «Список» (−30%) */
#cats.v-list .cat{margin-bottom:8px;border-radius:17px}
#cats.v-list .cat-head{padding:9px 12px;gap:11px}
#cats.v-list .cat-emoji{width:38px;height:38px;border-radius:12px;font-size:21px}
#cats.v-list .cat-text{gap:1px}
#cats.v-list .cat-text b{font-size:14.5px}
#cats.v-list .cat-text small{font-size:12px}
#cats.v-list .chev{width:20px;height:20px}
#cats.v-list .badge,#cats.v-line .badge,#cats.v-grid .badge{min-width:22px;height:22px;font-size:11.5px}
/* Вид «Строки» (−40%) */
#cats.v-line .cat{margin-bottom:5px;border-radius:15px;box-shadow:0 1px 2px rgba(17,19,22,.04),0 3px 10px rgba(17,19,22,.05)}
#cats.v-line .cat-head{padding:7px 12px 7px 8px;gap:10px}
#cats.v-line .cat-emoji{width:34px;height:34px;border-radius:11px;font-size:19px}
#cats.v-line .cat-text{flex-direction:row;align-items:baseline;gap:8px}
#cats.v-line .cat-text b{font-size:14.5px;flex:0 1 auto}
#cats.v-line .cat-text small{font-size:12px;white-space:nowrap;flex:none}
#cats.v-line .cat:not(.open) .cnt{display:none}
#cats.v-line .chev{width:19px;height:19px}
/* Вид «Плитки» (сетка 2 колонки, −42%) */
#cats.v-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;grid-auto-flow:row dense;margin-bottom:12px}
#cats.v-grid .cat{margin:0;border-radius:18px;position:relative;min-width:0}
#cats.v-grid .cat.open{grid-column:1/-1}
#cats.v-grid .cat:not(.open) .cat-head{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px}
#cats.v-grid .cat:not(.open) .cat-emoji{width:36px;height:36px;border-radius:12px;font-size:20px}
#cats.v-grid .cat:not(.open) .cat-text{width:100%;gap:1px}
#cats.v-grid .cat:not(.open) .cat-text b{font-size:14px}
#cats.v-grid .cat:not(.open) .cat-text small{font-size:12px;white-space:nowrap}
#cats.v-grid .cat:not(.open) .cnt{display:none}
#cats.v-grid .cat:not(.open) .chev{position:absolute;right:10px;top:12px;width:18px;height:18px}
#cats.v-grid .cat:not(.open) .badge{position:absolute;right:34px;top:11px}
#cats.v-grid .cat.open .cat-head{padding:11px 14px;gap:12px}
#cats.v-grid .cat.open .cat-emoji{width:42px;height:42px;border-radius:13px;font-size:23px}
/* ---------- Шапка-карусель: VASABI · X-Finance · X-Car · «Всё в одном месте» ---------- */
.rot{position:relative;height:64px;margin:calc(10px + env(safe-area-inset-top)) -16px 0;perspective:800px}
.rs{position:absolute;inset:0;padding:0 16px;display:flex;align-items:center;gap:12px;visibility:hidden;background:#fff}
.rs.on,.rs.out{visibility:visible}
.rs.on{z-index:2}.rs.out{z-index:1}
/* Эффект 1 — плавно */
[data-fx="1"] .rs{opacity:0;transition:opacity .7s ease}
[data-fx="1"] .rs.on{opacity:1}
[data-fx="1"] .rs>*{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
[data-fx="1"] .rs:not(.on)>*{transform:translateY(6px)}
/* Эффект 2 — карточки складываются (переворот) */
[data-fx="2"] .rs{transform:rotateX(-90deg);transform-origin:50% 50% -35px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .7s cubic-bezier(.3,.7,.25,1)}
[data-fx="2"] .rs.on{transform:none}
[data-fx="2"] .rs.out{transform:rotateX(90deg)}
/* Эффект 3 — простое переключение (сдвиг) */
.rot[data-fx="3"]{overflow:hidden}
[data-fx="3"] .rs{transform:translateX(100%);transition:transform .55s cubic-bezier(.3,.7,.2,1)}
[data-fx="3"] .rs.on{transform:none}
[data-fx="3"] .rs.out{transform:translateX(-100%)}
/* Эффект 4 — заполнение слева направо */
[data-fx="4"] .rs{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);transition:clip-path .75s,-webkit-clip-path .75s cubic-bezier(.65,0,.25,1)}
[data-fx="4"] .rs.on{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}
[data-fx="4"] .rs.out{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);transition:none}
.rs.ad-s{cursor:pointer;background:radial-gradient(90% 160% at 100% 50%,var(--tint) 0,rgba(255,255,255,0) 70%),#fff}
.rs.ad-s:active .ad-logo{transform:scale(.94)}
.ad-logo{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 15px/1 var(--head);letter-spacing:-.02em;background:linear-gradient(140deg,var(--c0),var(--c2));box-shadow:0 6px 16px -6px var(--c0);transition:transform .2s}
.rs-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ad-title{font:800 21px/1.1 var(--head);letter-spacing:-.005em;background:linear-gradient(100deg,var(--c0) 0%,var(--c1) 25%,var(--c2) 50%,var(--c1) 75%,var(--c0) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 3.2s linear infinite;align-self:flex-start}
@keyframes shine{from{background-position:0 0}to{background-position:-200% 0}}
.rs-line{display:flex;align-items:center;gap:8px}
.rs-sub{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.rs-sub span{overflow:hidden;text-overflow:ellipsis}
.ad-go{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--c0);flex:none}
/* 4-й баннер «Всё в одном месте» */
.rs.info-s{background:linear-gradient(100deg,rgba(31,166,74,.07),rgba(14,159,110,.06) 45%,rgba(37,99,235,.08)),#fff}
.trio{position:relative;width:78px;height:46px;flex:none}
.trio i{position:absolute;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 10.5px/1 var(--head);font-style:normal;border:2px solid #fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.trio .t-v{left:0;background:linear-gradient(145deg,#27b956,#15843a);font-size:14px;z-index:1;transform:rotate(-8deg)}
.trio .t-f{left:22px;background:linear-gradient(140deg,#0e9f6e,#0b6b4f);z-index:2;transform:translateY(-3px)}
.trio .t-c{left:44px;background:linear-gradient(140deg,#2563eb,#7c3aed);z-index:3;transform:rotate(8deg)}
.rs.info-s.on .trio i{animation:trio .7s cubic-bezier(.2,.9,.3,1.3) both}
.rs.info-s.on .trio .t-f{animation-delay:.12s}.rs.info-s.on .trio .t-c{animation-delay:.24s}
@keyframes trio{from{opacity:0;translate:-10px 0}to{opacity:1;translate:0 0}}
.pin3{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;background:conic-gradient(from 210deg,#1fa64a,#0e9f6e,#2563eb,#7c3aed,#1fa64a);box-shadow:0 6px 16px -6px #2563eb}
.info-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.info-a{font:800 15px/1.2 var(--head);letter-spacing:-.01em;background:linear-gradient(100deg,#1fa64a 0%,#d6a92b 25%,#2563eb 50%,#7c3aed 75%,#1fa64a 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;align-self:flex-start}
.info-a.big{font-size:21px;line-height:1.1;margin-bottom:2px}
.info-b{font-size:12.5px;font-weight:800;line-height:1.3;color:var(--ink2);min-height:16px;white-space:nowrap}
.info-c{font-size:11.5px;font-weight:700;line-height:1.3;color:var(--muted);min-height:15px;white-space:nowrap;overflow:hidden}
.info-d{font-size:13px;font-weight:700;line-height:1.3;color:var(--muted);min-height:17px;white-space:nowrap}
.typing:after{content:'';display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:#2563eb;animation:caret .7s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.rot-dots{display:flex;justify-content:center;gap:4px;padding:6px 0 8px}
/* Шапка в карточке */
.top .wrap{padding-top:calc(14px + env(safe-area-inset-top))}
#rot{margin:0;height:70px;border-radius:22px;border:1px solid var(--line);overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(17,19,22,.04),0 8px 24px rgba(17,19,22,.07);touch-action:none;user-select:none;-webkit-user-select:none}
#rot .rs{padding:0 12px}
#rotDots{padding:9px 0 10px}
.install .lbl{display:none}
.install{width:42px;padding:0;justify-content:center}
/* направление назад для «Сдвиг» и «Заполнение» */
[data-fx="3"].rev .rs{transform:translateX(-100%)}
[data-fx="3"].rev .rs.on{transform:none}
[data-fx="3"].rev .rs.out{transform:translateX(100%)}
[data-fx="4"].rev .rs{-webkit-clip-path:inset(0 0 0 100%);clip-path:inset(0 0 0 100%)}
[data-fx="4"].rev .rs.on{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}
[data-fx="2"].rev .rs{transform:rotateX(90deg)}
[data-fx="2"].rev .rs.on{transform:none}
[data-fx="2"].rev .rs.out{transform:rotateX(-90deg)}
.rot-dots i{width:5px;height:5px;border-radius:3px;background:#dfe2e6;transition:all .5s}
.rot-dots i.on{width:14px;background:var(--ink)}
/* настройки шапки */
.set-h{margin:22px 0 10px 2px;font:700 16px/1.2 var(--head)}
.fx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fx-b{text-align:left;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.fx-b b{font:700 13.5px/1.2 var(--head)}
.fx-b small{font-size:12px;font-weight:600;color:var(--muted)}
.fx-b.on{border-color:var(--acc);background:var(--acc-soft)}
.fx-b.on b{color:var(--acc2)}
.rot.demo{margin:0 0 6px;border:1px solid var(--line);border-radius:18px;overflow:hidden;pointer-events:none}
.demo-cap{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:14px}
.set-note{font-size:12.5px;font-weight:600;color:var(--muted);margin:-4px 2px 14px;line-height:1.5}

/* ---------- Рекламные страницы ---------- */
.page{position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.page.open{transform:none;visibility:visible}
.pg-top{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.pg-top .wrap{display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.pg-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.pg-brand .ad-logo{width:40px;height:40px;border-radius:13px;font-size:14px;transform:none;box-shadow:0 6px 14px -6px var(--c0)}
.pg-brand .ad-title{font-size:20px}
.pg-tagline{font-size:11.5px;font-weight:700;color:var(--muted)}
.pg-hero{position:relative;overflow:hidden;margin:16px 0 22px;border-radius:28px;padding:26px 20px 22px;background:linear-gradient(160deg,var(--tint),#fff 70%);border:1px solid var(--line);isolation:isolate}
.pg-hero:before,.pg-hero:after{content:'';position:absolute;z-index:-1;border-radius:50%;filter:blur(40px);opacity:.35}
.pg-hero:before{width:180px;height:180px;right:-50px;top:-60px;background:var(--c1)}
.pg-hero:after{width:160px;height:160px;left:-60px;bottom:-80px;background:var(--c0);opacity:.2}
.pg-hero .ad-logo{width:64px;height:64px;border-radius:20px;font-size:21px;transform:none;margin-bottom:16px}
.pg-hero .ad-title{display:inline-block;font-size:34px;line-height:1.05}
.pg-hero h3{margin:6px 0 10px;font:700 17px/1.3 var(--head);color:var(--ink)}
.pg-hero p{margin:0 0 16px;font-size:15px;font-weight:600;line-height:1.55;color:var(--ink2)}
.pg-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pg-pills span{height:30px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.pg-pills span:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c0)}
.pg-addr{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;color:var(--ink2)}
.pg-addr svg{color:var(--c0)}
.pg-h{margin:0 0 12px 2px;font:700 18px/1.25 var(--head)}
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.pg-card{border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff;box-shadow:var(--shadow)}
.pg-card .e{width:46px;height:46px;border-radius:15px;background:var(--tint);display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.pg-card b{display:block;font:600 14px/1.25 var(--head);margin-bottom:4px}
.pg-card small{display:block;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.4}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:26px;border-radius:20px;overflow:hidden}
.ph-t{appearance:none;border:0;padding:0;margin:0;aspect-ratio:1;background:var(--soft);overflow:hidden;cursor:zoom-in;display:block}
.ph-t img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.ph-t:active img{transform:scale(1.06)}
.page.open .ph-t{animation:phin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) + .15s)}
@keyframes phin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.lb{position:fixed;inset:0;z-index:95;background:#08090b;opacity:0;pointer-events:none;transition:opacity .25s}
.lb.show{opacity:1;pointer-events:auto}
.lb-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.lb-track::-webkit-scrollbar{display:none}
.lb-s{flex:0 0 100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;padding:60px 0 40px}
.lb-s img{max-width:100%;max-height:100%;object-fit:contain}
.lb-bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;color:#fff;font-weight:800;font-size:14px}
.lb-x{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.cars-soon{border:1.5px dashed #d8dce1;border-radius:22px;padding:18px 16px 16px;text-align:center;background:linear-gradient(160deg,var(--tint),#fff 75%);margin-bottom:26px}
.cars-soon .row{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.cars-soon .row svg{width:30%;max-width:110px}
.cars-soon b{display:block;font:600 15px/1.3 var(--head);margin-bottom:4px}
.cars-soon small{font-size:13px;font-weight:600;color:var(--muted);line-height:1.5}
.req{border:1px solid var(--line);border-radius:22px;padding:6px 16px;margin-bottom:26px;box-shadow:var(--shadow)}
.req div{display:flex;align-items:center;gap:14px;padding:12px 0}
.req div+div{border-top:1px solid var(--line)}
.req i{font-style:normal;width:42px;height:42px;border-radius:14px;background:var(--tint);display:grid;place-items:center;font-size:21px;flex:none}
.req b{display:block;font-size:15px;font-weight:800}
.req small{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:1px}
.pg-contact{border-radius:28px;padding:22px 18px 20px;background:var(--ink);color:#fff;text-align:center;margin-bottom:18px;position:relative;overflow:hidden;isolation:isolate}
.pg-contact:before{content:'';position:absolute;z-index:-1;width:220px;height:220px;border-radius:50%;right:-80px;top:-110px;background:var(--c0);filter:blur(50px);opacity:.45}
.pg-contact h3{margin:0 0 4px;font:700 18px/1.3 var(--head)}
.pg-contact .ph{display:block;margin:6px 0 16px;font:700 25px/1.2 var(--head);color:#fff;text-decoration:none;letter-spacing:.01em}
.wa-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wa-b{height:62px;border:0;border-radius:17px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:14px;line-height:1.1}
.wa-b span{display:flex;align-items:center;gap:6px}
.wa-b small{font-size:11px;font-weight:700;opacity:.85}
.wa-b.n{background:#25d366}
.wa-b.b{background:#128c7e}
.wa-b:active,.pg-sec:active{transform:scale(.97)}
.pg-sec-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pg-sec{height:46px;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.pg-note{margin:14px 4px 0;font-size:12.5px;font-weight:600;line-height:1.55;color:#b9bec6}
.pg-note b{color:#fff}
.pg-foot{text-align:center;font-size:12px;font-weight:700;color:#a3a8b0;margin:0 0 calc(24px + env(safe-area-inset-bottom))}
.cat{background:#fff;border:1px solid var(--line);border-radius:22px;margin:0 0 12px;box-shadow:var(--shadow);transition:border-color .25s,box-shadow .25s}
.cat.open{border-color:#e2e5e9;box-shadow:0 1px 2px rgba(17,19,22,.04),0 14px 34px rgba(17,19,22,.08)}
.cat-head{appearance:none;border:0;background:none;display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left}
.cat-emoji{width:50px;height:50px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:27px;flex:none;transition:background .25s,transform .25s}
.cat.open .cat-emoji{background:var(--acc-soft);transform:rotate(-6deg)}
.cat-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cat-text b{font:600 16px/1.2 var(--head);letter-spacing:-.005em}
.cat-text small{color:var(--muted);font-size:13px;font-weight:600}
.badge{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--acc);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center;transform:scale(0);transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.badge.on{transform:scale(1)}
.chev{color:#a3a8b0;transition:transform .35s cubic-bezier(.2,.8,.2,1);flex:none}
.cat.open .chev{transform:rotate(180deg);color:var(--ink2)}
.cat-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.8,.2,1)}
.cat.open .cat-body{grid-template-rows:1fr}
.cat-inner{overflow:hidden;min-height:0}
.items{padding:2px 8px 10px;border-top:1px dashed var(--line);margin:0 8px;padding-top:8px}
.item{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 12px;border-radius:16px;transition:background .2s}
.item+.item{margin-top:2px}
.item.in{background:var(--acc-soft)}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer;user-select:none;padding:3px 0}
.item-name{font-weight:700;font-size:15px;line-height:1.25}
.item-price{font-weight:800;font-size:14px;color:var(--muted);transition:color .2s}
.item.in .item-price{color:var(--acc2)}

/* stepper */
.stepper{display:flex;align-items:center;gap:2px;flex:none}
.st{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;transition:transform .12s,background .2s,color .2s;padding:0}
.st:active{transform:scale(.86)}
.st-inc{background:var(--ink);color:#fff}
.in .st-inc{background:var(--acc)}
.st-dec{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px #dadee3}
.st-q{min-width:30px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.stepper .st-dec,.stepper .st-q{display:none}
.in .stepper .st-dec{display:grid}
.in .stepper .st-q{display:block}
.stepper.sm .st{width:32px;height:32px}
.stepper.sm .st-q{min-width:24px;font-size:14.5px}
.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- Order ---------- */
.order{margin-top:22px;scroll-margin-top:90px}
.order-card{border:1px solid var(--line);border-radius:24px;padding:18px 16px;box-shadow:var(--shadow);background:#fff}
.order-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.order-head h2{margin:0;font:700 19px/1.2 var(--head)}
.link-btn{border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:6px 4px}
.link-btn:active{color:var(--danger)}
.clear-btn{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border:0;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-weight:800;font-size:13px;white-space:nowrap;transition:transform .12s,background .2s}
.clear-btn:active{transform:scale(.95);background:#fbd9da}
.empty{text-align:center;padding:26px 16px;border:1.5px dashed #e1e4e8;border-radius:24px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px/1.3 var(--head);margin:10px 0 4px}
.empty p{margin:0;font-size:14px;font-weight:600}
.empty .big{font-size:40px}
.ol{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ol-main{flex:1;min-width:0}
.ol-main b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.ol-main small{color:var(--muted);font-weight:600;font-size:12.5px}
.ol-sum{min-width:74px;text-align:right;font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums}
.note{display:block;position:relative;margin:16px 0 0}
.note .ni{position:absolute;left:14px;top:13px;color:var(--acc);pointer-events:none;display:flex}
#note{border:0;background:var(--acc-soft);border-radius:18px 18px 18px 6px;padding:12px 14px 12px 42px;font-size:15px;font-weight:600;color:#1d4d2c;resize:none;min-height:46px;max-height:160px;overflow-y:auto;line-height:1.45;display:block}
#note::placeholder{color:#6aa47e}
#note:focus{background:#e1f4e7;box-shadow:0 0 0 2px var(--acc-line)}
.field span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
textarea,input[type=text],input[type=number],input[type=tel]{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);padding:11px 13px;font-size:15px;font-weight:600;outline:none;transition:border-color .2s,background .2s;resize:vertical}
textarea:focus,input:focus{border-color:var(--acc);background:#fff}
.text-card{margin-top:14px;background:var(--soft);border-radius:18px;padding:12px 12px 14px}
.text-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.text-head span{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:2px}
.copy-chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;border:1px solid #dfe2e6;background:#fff;font-size:12.5px;font-weight:800;color:var(--ink2);transition:all .2s}
.copy-chip:active{transform:scale(.95)}
.text-head .copy-chip span{color:inherit;margin:0;font-size:inherit}
.copy-chip.done{background:var(--acc);border-color:var(--acc);color:#fff}
.th-btns{display:flex;align-items:center;gap:6px;flex:none}
.mode-pill{height:32px;padding:0 11px 0 8px;border-radius:999px;border:1px solid #dfe2e6;background:#fff;display:flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;color:var(--ink2);transition:background .2s,color .2s,transform .12s;white-space:nowrap}
.mode-pill:active{transform:scale(.94)}
.mode-pill[hidden]{display:none}
.icon-btn[hidden]{display:none}
/* удержание шапки 5 секунд */
#rot .hold-bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#1fa64a,#2563eb);z-index:5;border-radius:0 3px 3px 0;pointer-events:none;opacity:0}
#rot.holding .hold-bar{opacity:1;width:100%;transition:width 3.6s linear,opacity .2s}
/* окно пароля */
.pw-box{position:relative;margin-top:6px}
.pw-box input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:15px;background:var(--soft);padding:0 48px 0 15px;font-size:16px;font-weight:700;outline:none;letter-spacing:.02em}
.pw-box input:focus{border-color:var(--acc);background:#fff}
.pw-box.err input{border-color:var(--danger);background:var(--danger-soft);animation:shake .4s}
.pw-eye{position:absolute;right:6px;top:6px;width:38px;height:38px;border:0;border-radius:11px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.pw-msg{min-height:20px;margin:8px 2px 0;font-size:13px;font-weight:700;color:var(--danger)}
.pw-lock{width:52px;height:52px;margin:0 auto 10px;border-radius:17px;background:var(--acc-soft);color:var(--acc2);display:grid;place-items:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* iPhone/Safari: шрифт полей ≥16px — иначе страница «прыгает» (зум) при вводе */
@supports (-webkit-touch-callout: none) { textarea, input[type=text], input[type=number], input[type=tel], #note, .ed-item input.ed-name, .ed-price input { font-size:16px !important; } }
#rot{-webkit-touch-callout:none}
img{-webkit-user-drag:none}
.mode-pill svg{flex:none}
.mode-pill .mt{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#eef0f3;color:var(--ink);font:800 11px/1 var(--body)}
.mode-pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mode-pill.on .mt{background:var(--acc);color:#fff}
.mode-pill.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.copy-chip.icon{width:32px;height:32px;padding:0;justify-content:center;flex:none}
.style-chip{width:30px;height:30px;border-radius:50%;border:1px solid #dfe2e6;background:#fff;display:grid;place-items:center;font:15px/1 var(--body);color:var(--ink);transition:transform .15s}
.style-chip:active{transform:scale(.88)}
.style-chip.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.style-chip[hidden]{display:none}
#styleName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.text-head{gap:8px}
.img-chip{position:relative;color:var(--ink2)}
.img-chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.img-chip i{position:absolute;right:-3px;bottom:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#111316;color:#fff;font:800 9.5px/15px var(--body);font-style:normal;text-align:center;box-shadow:0 0 0 2px #efeae2}
.img-prev{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.img-note{margin:8px 2px 0;font-size:12px;font-weight:700;color:#7b7f86;text-align:center}
.gif-wait{display:flex;align-items:center;justify-content:center;gap:10px;height:62px;border-radius:17px;background:var(--soft);font-weight:800;font-size:14.5px;color:var(--ink2)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid #d6dade;border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.share-btn{width:100%;height:62px;border:0;border-radius:17px;background:#25d366;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px}
.share-btn:active{transform:scale(.98)}
.dl-btn{width:100%;height:46px;margin-top:8px;border-radius:15px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--ink2)}
.send-prev{display:block;max-height:220px;margin:0 auto 12px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.text-card.wa-bg{background:#efeae2;background-image:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1.3px);background-size:14px 14px}
.wa-bubble{margin-left:auto;max-width:100%;background:#d9fdd3;border-radius:12px 3px 12px 12px;padding:9px 11px 10px;box-shadow:0 1px .5px rgba(0,0,0,.13);font:400 14.5px/1.42 Roboto,system-ui,'Segoe UI',Arial,sans-serif;color:#111b21;word-wrap:break-word;overflow-x:auto}
.wa-bubble b{font-weight:700}
.wa-bubble>div{white-space:pre-wrap}
.wa-bubble>div.nw{white-space:nowrap}
.wa-bubble .mono{white-space:pre;font:400 var(--mf,12.6px)/1.45 'Droid Sans Mono','Roboto Mono',ui-monospace,Menlo,Consolas,monospace;margin:1px 0}
.wa-bubble code{white-space:pre;font:400 var(--mf,12.6px)/1.5 'Droid Sans Mono','Roboto Mono',ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px}
.wa-bubble .q{border-left:4px solid #06cf9c;background:rgba(0,0,0,.035);border-radius:6px;padding:4px 8px;margin:3px 0}
.switch-row{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;cursor:pointer}
.switch-row div{flex:1}.switch-row b{display:block;font-size:14.5px;font-weight:800}.switch-row small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:#d5d9de;transition:background .2s}
.sw span:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:after{transform:translateX(20px)}
.total{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 14px;padding-top:14px;border-top:1.5px dashed #e1e4e8}
.total span{font-weight:700;color:var(--muted);font-size:15px}
.total b{font:700 28px/1 var(--head);letter-spacing:-.02em}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:17px;background:#25d366;color:#fff;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 8px 20px rgba(37,211,102,.3);transition:transform .12s}
.wa-btn:active{transform:scale(.98)}
button.wa-btn{width:100%;border:0;font-family:inherit}
.send-sheet .wa-pair{margin-top:4px}
.send-sheet .wa-b{height:70px;font-size:15px}
.send-sheet .wa-b small{font-size:12px}
.send-sum{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:16px;background:var(--soft);margin-bottom:12px}
.send-sum span{font-size:13.5px;font-weight:700;color:var(--muted)}
.send-sum b{font:700 20px/1 var(--head);color:var(--ink)}
.send-note{margin:12px 2px 0;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.5;text-align:center}
.foot{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin:26px 0 8px;line-height:1.6}
.foot a{color:var(--ink2);text-decoration:none;font-weight:800}

/* ---------- Bottom bar ---------- */
.bar{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;margin:0 auto;max-width:536px;transform:translate3d(0,calc(100% + 40px + env(safe-area-inset-bottom)),0);opacity:0;visibility:hidden;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s linear .35s;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:20px;padding:9px 9px 9px 18px;box-shadow:0 14px 34px rgba(17,19,22,.28)}
.bar.show{transform:translate3d(0,0,0);opacity:1;visibility:visible;pointer-events:auto;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s}
.bar-info{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-info small{color:#a9aeb6;font-weight:700;font-size:12px}
.bar-info b{font:700 19px/1.2 var(--head)}
.bar-btn{height:46px;border:0;border-radius:15px;background:var(--acc);color:#fff;font-weight:800;font-size:15px;padding:0 16px;display:flex;align-items:center;gap:6px}
.bar-btn:active{transform:scale(.96)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:100;background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast:not(.show){visibility:hidden;opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .3s}
.toast.show{transform:translate(-50%,0);visibility:visible;opacity:1}
.ol-main small{white-space:nowrap}
.order-head h2{white-space:nowrap}
/* Узкие телефоны (Galaxy Fold, старые Android) */
@media (max-width:359px){
  .wrap{padding:0 12px}
  .brand h1{font-size:18px}.brand p{font-size:12px}
  .mark{width:40px;height:40px;font-size:20px;border-radius:13px}
  #rot .rs{gap:9px;padding:0 9px}
  .icon-btn,.install{width:38px;height:38px}
  .order-card{padding:16px 12px}
  .order-head h2{font-size:17px}
  .clear-btn{padding:0 9px;font-size:12px}
  .ol{gap:6px}
  .ol-main b{font-size:13.5px}
  .ol-main small{font-size:11.5px}
  .stepper.sm .st{width:28px;height:28px}
  .stepper.sm .st-q{min-width:20px;font-size:13.5px}
  .ol-sum{min-width:0;font-size:13.5px}
  .mode-pill{padding:0 9px 0 6px;font-size:12px;gap:4px}
  .mode-pill .mt{width:16px;height:16px;font-size:10px}
  #styleName{display:none}
  .text-head{justify-content:flex-end}
  .cat-text b{font-size:13.5px}
}

/* ---------- Settings sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:#fff;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-top{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.sheet-row{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 12px}
.sheet-row h2{flex:1;margin:0;font:700 20px/1 var(--head)}
.tabs{display:flex;gap:6px;padding:0 0 12px}
.tab{flex:1;height:40px;border-radius:13px;border:0;background:var(--soft);font-weight:800;font-size:14px;color:var(--muted);transition:all .2s}
.tab.on{background:var(--ink);color:#fff}
.pane{padding:16px 0 40px}
.hint{margin:0 0 14px;color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.5}
.ed-cat{border:1px solid var(--line);border-radius:20px;margin-bottom:10px;background:#fff;overflow:hidden}
.ed-head{display:flex;align-items:center;gap:8px;padding:10px}
.ed-head input.ed-emoji{width:52px;flex:none;text-align:center;font-size:22px;padding:7px 4px}
.ed-head input.ed-title{flex:1;min-width:0;font-weight:800}
.ed-count{font-size:12px;font-weight:800;color:var(--muted);flex:none}
.ed-body{display:none;padding:0 10px 12px;border-top:1px dashed var(--line)}
.ed-cat.open .ed-body{display:block}
.ed-cat.open .ed-tg svg{transform:rotate(180deg)}
.ed-tg svg{transition:transform .25s}
.ed-item{display:flex;align-items:center;gap:6px;margin-top:8px}
.ed-item input.ed-name{flex:1;min-width:0;padding:10px 11px;font-size:14.5px}
.ed-price{position:relative;width:104px;flex:none}
.ed-price input{padding:10px 26px 10px 11px;font-size:14.5px;font-weight:800;-moz-appearance:textfield}
.ed-price input::-webkit-outer-spin-button,.ed-price input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ed-price span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800;font-size:14px;pointer-events:none}
.mini{width:36px;height:36px;border-radius:11px;border:0;background:var(--soft);display:grid;place-items:center;color:var(--muted);flex:none}
.mini.del:active{background:var(--danger-soft);color:var(--danger)}
.ghost-btn{width:100%;height:44px;margin-top:10px;border-radius:14px;border:1.5px dashed #d6dade;background:#fff;font-weight:800;font-size:14px;color:var(--ink2)}
.ed-actions{display:flex;gap:6px;margin-top:10px}

.primary-btn{width:100%;height:50px;border-radius:16px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:15px;margin-top:6px}
.primary-btn.green{background:var(--acc)}

.sec-btn.danger{color:var(--danger)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:38px;border:0;border-radius:11px;background:none;font-weight:800;font-size:13.5px;color:var(--muted);transition:all .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
textarea.code{font:600 13px/1.5 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;min-height:120px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.btn-row button{flex:1 1 auto;height:42px;padding:0 14px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.btn-row button.green{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-row button.wa{background:#25d366;border-color:#25d366;color:#fff}
.pv{margin-top:16px}
.pv-empty{padding:22px;text-align:center;color:var(--muted);font-weight:600;font-size:14px;border:1.5px dashed #e1e4e8;border-radius:18px}
.pv-bad{padding:16px;border-radius:16px;background:var(--danger-soft);color:#b42328;font-weight:700;font-size:14px;line-height:1.5}
.pv-sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:800;color:var(--ink2)}
.tag.g{background:var(--acc-soft);color:var(--acc2)}
.tag.o{background:#fff4e5;color:#b25e00}
.tag.r{background:var(--danger-soft);color:#c62a2f}
.pv-meta{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px}
.pv-cat{border:1px solid var(--line);border-radius:18px;margin-bottom:8px;overflow:hidden}
.pv-cat h4{margin:0;padding:11px 14px;font:600 14.5px/1.2 var(--head);background:var(--soft);display:flex;justify-content:space-between;align-items:center}
.pv-cat h4 small{font:800 12px var(--body);color:var(--muted)}
.pv-it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.pv-it b{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pv-it s{color:var(--muted);font-weight:700;margin-right:4px}
.pv-it .t{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.pv-it .t.new{background:var(--acc-soft);color:var(--acc2)}
.pv-it .t.up{background:#fff4e5;color:#b25e00}
.pv-err{margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff8ec;font-size:13px;font-weight:600;color:#8a5300;line-height:1.5}
.field{display:block;margin-bottom:14px}
.info{background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:18px;padding:14px 16px;font-size:13.5px;line-height:1.55;font-weight:600;color:#1d4d2c;margin:4px 0 14px}
.info > b{display:block;font:600 14.5px/1.3 var(--head);margin-bottom:6px;color:#123a20}
.info ol{margin:6px 0 0;padding-left:18px}
.status{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:15px;background:var(--soft);font-size:13.5px;font-weight:700;margin-bottom:12px}
.status i{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
.status.local i{background:#f5a524}
.ver{text-align:center;color:#a3a8b0;font-size:12px;font-weight:700;margin-top:24px}

.modal{position:fixed;inset:0;z-index:90;background:rgba(17,19,22,.42);display:flex;align-items:flex-end;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}

.modal-box{width:100%;max-width:440px;background:#fff;border-radius:26px;padding:22px 18px 16px;transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.8,.2,1);margin-bottom:env(safe-area-inset-bottom)}
.modal.show .modal-box{transform:none}
.modal-box h3{margin:0 0 8px;font:700 18px/1.3 var(--head)}
.modal-body{color:var(--ink2);font-size:14.5px;font-weight:600;line-height:1.5}
.modal-btns{display:flex;gap:8px;margin-top:18px}
.modal-btns button{flex:1;height:48px;border-radius:15px;border:0;font-weight:800;font-size:15px}
.m-cancel{background:var(--soft);color:var(--ink2)}
.m-ok{background:var(--ink);color:#fff}

<script>
/* VASABI — рисование картинки заказа (для GIF).
   drawOrderCard(canvas, data, variant, t)
   data: { name, sub, date, time, items:[{e,n,q,p}], note, phone }
   variant: 0 Чек · 1 Бренд · 2 Плитки
   t: 0..1 — фаза анимации (переливание названия, блики) */
(function (g) {
  'use strict';
  const W = 600;
  const FONT = '"Manrope","Segoe UI",Roboto,"DejaVu Sans",Arial,sans-serif';
  const HEAD = '"Unbounded","Manrope","Segoe UI",Roboto,"DejaVu Sans",Arial,sans-serif';
  const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const num = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const rub = n => num(n) + ' ₽';
  const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[(a > 10 && a < 20) ? 2 : (b > 1 && b < 5) ? 1 : (b === 1 ? 0 : 2)]; };

    const w = c.measureText(s).width, x0 = align === 'center' ? x - w / 2 : x;
    const span = w * 2, off = -span * t;
    const gr = c.createLinearGradient(x0 + off, 0, x0 + off + span * 2, 0);

        else if (k === 'phone' || k === 'телефон') menu.phone = normPhone(m[2]);

}

  let need = 0; b.querySelectorAll('.mono,.nw').forEach(e => { need = Math.max(need, e.scrollWidth); });
  if (need <= avail + 1) return;
  let mf = Math.max(8.5, 12.6 * avail / need - .15);

    let w = 0; b.querySelectorAll('.mono,.nw').forEach(e => { w = Math.max(w, e.scrollWidth); });

function diffMenus(next){
  const cur = new Map(), curByName = new Map();
  menu.cats.forEach(c => c.items.forEach(i => { if (!i.name.trim()) return; cur.set(c.title.trim().toLowerCase() + '|' + i.name.trim().toLowerCase(), i.price); curByName.set(i.name.trim().toLowerCase(), i.price); }));
  let added = 0, changed = 0; const seen = new Set(); const marks = new Map();
  next.cats.forEach(c => c.items.forEach(i => {
    const k = c.title.trim().toLowerCase() + '|' + i.name.trim().toLowerCase(), n = i.name.trim().toLowerCase();
    let old = cur.has(k) ? cur.get(k) : curByName.has(n) ? curByName.get(n) : undefined;
    if (cur.has(k)) seen.add(k);
    if (old === undefined) { added++; marks.set(i.id, { t:'new' }); }
    else if (old !== i.price) { changed++; marks.set(i.id, { t:'up', old }); }
  }));
  const removed = [...cur.keys()].filter(k => !seen.has(k)).filter(k => {
    const n = k.split('|')[1]; return !next.cats.some(c => c.items.some(i => i.name.trim().toLowerCase() === n));
  }).length;
  return { added, changed, removed, marks };
}

/* Эффект «пишется» */
function typeIn(slide){
  const els = $$('[data-type]', slide); if (!els.length) return;
  clearInterval(slide._t); els.forEach(e => { e.textContent = ''; e.classList.remove('typing'); });
  const parts = els.map(e => [...e.dataset.type]);
  const total = parts.reduce((s,a) => s + a.length, 0), step = Math.max(18, 2300 / total);
  let k = 0, pos = 0;
  slide._t = setInterval(() => {
    const e = els[k]; if (!e) { clearInterval(slide._t); return; }
    e.classList.add('typing'); pos++; e.textContent = parts[k].slice(0, pos).join('');
    if (pos >= parts[k].length) { pos = 0; k++; if (els[k]) e.classList.remove('typing'); else setTimeout(() => e.classList.remove('typing'), 1200); }
  }, step);
}
function swapSlides(a, b){
  if (!b || a === b) return;
  if (a) { a.classList.remove('on'); a.classList.add('out'); clearTimeout(a._o); a._o = setTimeout(() => a.classList.remove('out'), 800); }
  clearTimeout(b._o); b.classList.remove('out'); void b.offsetWidth; b.classList.add('on'); typeIn(b);
}

function renderAd(){

  const home = $('.rs.home', rot); home.classList.remove('out'); home.classList.add('on');

  dots.hidden = slots.length < 2;
  dots.innerHTML = slots.map((_,i) => `<i class="${i ? '' : 'on'}"></i>`).join('');

  const busy = () => rotHolding || document.hidden || $('#sheet').classList.contains('open') || PAGES[location.hash.slice(1)] || Date.now() < rotHold;
  const go = dir => {

/* Свайп влево/вверх — следующая, вправо/вниз — предыдущая; удержание пальцем — пауза */
(() => {
  const rot = $('#rot'); let x0 = 0, y0 = 0, t0 = 0, down = false, swiped = false, longHold = false, holdT = 0, barT = 0;
  rot.insertAdjacentHTML('beforeend', '<span class="hold-bar"></span>');
  const stopHold = () => { clearTimeout(holdT); clearTimeout(barT); rot.classList.remove('holding'); };
  rot.addEventListener('pointerdown', e => {
    down = true; swiped = false; longHold = false; x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); rotHolding = true;
    stopHold();
    barT = setTimeout(() => { if (down && !swiped) rot.classList.add('holding'); }, 1400);       // полоска появляется через 1,4 с
    holdT = setTimeout(() => { if (down && !swiped) { longHold = true; stopHold(); if (navigator.vibrate) try { navigator.vibrate(30); } catch(err) {} requestSettings(); } }, 5000);
  });
  rot.addEventListener('pointermove', e => {
    if (!down || swiped) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax > 12 || ay > 12) stopHold();
    if (ax > 40 && ax > ay * 1.2) { swiped = true; if (rotGo) rotGo(dx < 0 ? 1 : -1); }
    else if (ay > 26 && ay > ax * 1.2) { swiped = true; if (rotGo) rotGo(dy < 0 ? 1 : -1); }
  });
  const up = () => { if (!down) return; stopHold(); down = false; longHold = Date.now() - t0 > 600; rotHolding = false; rotHold = Date.now() + 1500; };
  rot.addEventListener('pointerup', up); rot.addEventListener('pointercancel', up); rot.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') up(); });
  addEventListener('pointerup', up);
  rot.addEventListener('click', e => { if (swiped || longHold) { e.stopPropagation(); e.preventDefault(); } swiped = false; longHold = false; }, true);
  rot.addEventListener('contextmenu', e => e.preventDefault());
})();

          <a class="pg-sec" href="tel:+${XS_PHONE}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Позвонить</a>
          <button class="pg-sec" data-vcf><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>В контакты</button>
        </div>
        <p class="pg-note">${P.note}</p>
      </section>
      <p class="pg-foot">Xstore95 · xstore95.ru</p>
    </div>
  </div>`;
}
function renderPages(){
  $('#pages').innerHTML = Object.keys(PAGES).map(pageHTML).join('');
}
/* Просмотр фото на весь экран */
function openLB(i){
  const lb = $('#lb'), tr = $('#lbTrack');
  if (!tr.children.length) tr.innerHTML = Array.from({ length:CAR_PHOTOS }, (_,k) => `<div class="lb-s"><img src="cars/${k+1}.jpg" alt="Фото ${k+1}" loading="lazy"></div>`).join('');
  lb.classList.add('show'); tr.scrollLeft = i * tr.clientWidth; lbCount();
  history.pushState({ vpage:'xcar', lb:true }, '', location.hash);
}
function closeLB(){ if (history.state && history.state.lb) history.back(); else $('#lb').classList.remove('show'); }
function lbCount(){ const tr = $('#lbTrack'); $('#lbN').textContent = `${Math.round(tr.scrollLeft / tr.clientWidth) + 1} / ${CAR_PHOTOS}`; }
addEventListener('popstate', () => { if (!(history.state && history.state.lb)) $('#lb').classList.remove('show'); });
function syncPage(){
  const key = location.hash.slice(1);
  Object.keys(PAGES).forEach(k => { const el = $('#page-' + k); const on = k === key; el.classList.toggle('open', on); el.setAttribute('aria-hidden', !on); if (on) el.scrollTop = 0; });
  document.body.style.overflow = PAGES[key] || $('#sheet').classList.contains('open') ? 'hidden' : '';
}
function openPage(key){ history.pushState({ vpage:key }, '', '#' + key); syncPage(); }
function closePage(){
  if (history.state && history.state.vpage) history.back();
  else { history.replaceState(null, '', location.pathname + location.search); syncPage(); }
}
addEventListener('popstate', syncPage);
addEventListener('hashchange', syncPage);
function openWA(text, biz, phone){
  phone = phone || XS_PHONE;
  const enc = encodeURIComponent(text), web = `https://wa.me/${phone}?text=${enc}`;
  if (/android/i.test(navigator.userAgent)) {
    location.href = `intent://send/?phone=${phone}&text=${enc}#Intent;scheme=whatsapp;package=${biz ? 'com.whatsapp.w4b' : 'com.whatsapp'};S.browser_fallback_url=${encodeURIComponent(web)};end`;
  } else window.open(web, '_blank');
}
function saveContact(){
  const v = `BEGIN:VCARD\r\nVERSION:3.0\r\nFN:Xstore95 — X-Finance и X-Car\r\nORG:Xstore95\r\nTEL;TYPE=CELL:+${XS_PHONE}\r\nURL:https://xstore95.ru\r\nNOTE:Рассрочка по нормам ислама · Автопрокат без водителя\r\nEND:VCARD\r\n`;
  const url = URL.createObjectURL(new Blob([v], { type:'text/vcard;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = 'Xstore95.vcf';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Откройте скачанный файл — номер добавится в контакты');
}
document.addEventListener('click', e => {
  const ad = e.target.closest('.rs[data-page]'); if (ad) { openPage(ad.dataset.page); return; }
  if (e.target.closest('[data-back]')) { closePage(); return; }
  const ph = e.target.closest('[data-ph]'); if (ph) { openLB(+ph.dataset.ph); return; }
  if (e.target.closest('[data-lbclose]')) { closeLB(); return; }
  const w = e.target.closest('[data-wa]');
  if (w) { const k = w.dataset.wa; openWA(PAGES[k].msg, w.dataset.biz === '1'); return; }
  if (e.target.closest('[data-vcf]')) saveContact();
});

/* ================= Старт ================= */
loadInitialMenu(); pruneCart(); applyView(); renderAd(); renderPages(); $('#lbTrack').addEventListener('scroll', lbCount, { passive:true }); renderAll(); syncPage(); fetchRemote(false);
})();
</script>
</body>
